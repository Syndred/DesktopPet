<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵境 · 对战 V3 多状态预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3fb;color:#152b52;font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}header{padding:18px 24px 16px;background:#fff;border-bottom:1px solid #dbe4f1;position:sticky;top:0;z-index:1}.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;max-width:1600px;margin:auto}h1{margin:0;font-size:22px}.note{font-size:12px;color:#6b7f9d}.tabs{display:flex;gap:10px;flex-wrap:wrap;max-width:1600px;margin:14px auto 0}button{font:inherit;padding:9px 17px;background:#fff;color:#3c5679;border:1px solid #cfdded;border-radius:10px;cursor:pointer}button[aria-selected=true]{color:#fff;background:#2b78ee;border-color:#2b78ee}button:hover{border-color:#2b78ee}button:focus-visible,a:focus-visible{outline:3px solid #8bbbff;outline-offset:3px}main{max-width:1648px;padding:18px 24px 30px;margin:auto}.caption{display:flex;justify-content:space-between;gap:18px;margin-bottom:12px;color:#536c8f}.links{white-space:nowrap}a{color:#2465bf;text-decoration:none}a:hover{text-decoration:underline}img{display:block;width:100%;height:auto;border:1px solid #d5e0ef;border-radius:14px;background:#fff}footer{font-size:12px;color:#6b7f9d;margin-top:12px}@media(max-width:700px){header{padding:14px}.top{display:block}h1{font-size:18px}.tabs{gap:6px}button{padding:7px 9px}main{padding:14px}.caption{font-size:12px;display:block}}
</style></head><body><header><div class="top"><h1>灵境 · 对战 V3 多状态预览</h1><span class="note">场景内悬浮控件 · 环形蓄力 · 右下角日志 · 仅为视觉设计稿</span></div><div id="tabs" class="tabs" role="tablist" aria-label="设计状态"></div></header>
<main><div class="caption"><span id="caption"></span><span class="links"><a href="../battle-v2-states/index.html" target="_blank" rel="noopener">对比上一版</a> · <a id="original" href="01-ring-charging.png" target="_blank" rel="noopener">高清原图 ↗</a></span></div><img id="preview" src="01-ring-charging.png" alt="环形蓄力中的新版对战界面"><footer>大招默认显示 · 四个小按钮居中悬浮于背景 · 属性图标跟随等级 · 日志浮于右下角 · 数值与15s仅为示意</footer></main>
<script>
const states=[{"id":"charging","name":"环形蓄力中","file":"01-ring-charging.png","charge":36,"tooltip":null},{"id":"attack","name":"悬停攻击","file":"02-hover-attack.png","charge":36,"tooltip":"打断属性"},{"id":"element","name":"悬停属性","file":"03-hover-element.png","charge":36,"tooltip":"无法闪避"},{"id":"dodge","name":"悬停闪避","file":"04-hover-dodge.png","charge":36,"tooltip":"闪避攻击"},{"id":"ultimate","name":"大招蓄满","file":"05-ring-ultimate-ready.png","charge":100,"tooltip":null}];const tabs=document.getElementById('tabs'),preview=document.getElementById('preview'),caption=document.getElementById('caption'),original=document.getElementById('original');
function select(id){const s=states.find(x=>x.id===id)||states[0];preview.src=s.file;preview.alt=s.name+(s.tooltip?'：'+s.tooltip:'');caption.textContent=s.name+' · 大招环形蓄力 '+s.charge+'%'+(s.tooltip?' · '+s.tooltip:s.charge===100?' · 金色圆环已点亮':' · 大招默认可见');original.href=s.file;tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===s.id)));history.replaceState(null,'','#'+s.id);}
states.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s.name;b.dataset.id=s.id;b.setAttribute('role','tab');b.setAttribute('aria-selected','false');b.onclick=()=>select(s.id);tabs.appendChild(b);});select(location.hash.slice(1)||'charging');
</script></body></html>
