name: DesktopPet focused map and nearby controls acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/cloud-authority-convergence']
    paths:
      - '.github/workflows/cloud-map-discovery.yml'
      - 'apps/pc-app/runtime/features/discovery/map-adapter.cjs'
      - 'apps/pc-app/runtime/features/discovery/tile-cache.cjs'
      - 'apps/pc-app/runtime/features/discovery/index.cjs'
      - 'apps/pc-app/runtime/features/discovery/tests/map-provider.test.cjs'
      - 'apps/pc-app/ui/src/features/discovery/**'
      - 'apps/pc-app/ui/tests/discovery-controls.regressions.jsx'
      - 'scripts/acceptance/discovery-controls-dom.mjs'
      - 'scripts/acceptance/discovery-dom-deps/package.json'
      - 'scripts/acceptance/discovery-dom-deps/package-lock.json'

permissions:
  contents: read

concurrency:
  group: map-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  map-discovery:
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence' && !contains(github.event.head_commit.message, '[map-reuse-only]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check affected product contracts
        run: npm run typecheck
      - name: Type-check affected renderer contracts
        run: npm run typecheck:ui
      - name: Fixed provider, image bounds and source isolation contracts
        run: node --test apps/pc-app/runtime/features/discovery/tests/map-provider.test.cjs apps/pc-app/runtime/features/discovery/tests/qa-location.test.cjs
      - name: Existing discovery service and location admission contracts
        run: node scripts/desktop/run-native-tests.cjs apps/pc-app/runtime/features/discovery/tests/discovery.test.cjs
      - name: Install exact isolated DOM-only dependencies
        run: npm ci --prefix scripts/acceptance/discovery-dom-deps --ignore-scripts --no-audit --no-fund
      - name: Actual React nearby controls and late session response regressions
        run: |
          $jsdomPath = (Resolve-Path scripts/acceptance/discovery-dom-deps/node_modules/jsdom).Path
          node scripts/acceptance/discovery-controls-dom.mjs --jsdom=$jsdomPath
      - name: Build one actual new Windows portable
        run: npm run package:pc:win
      - name: Audit ASAR, source fingerprint and native closure
        id: audit
        run: npm run release:audit
      - name: Ordinary signed-out new executable startup
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        timeout-minutes: 6
        run: node scripts/acceptance/cloud-repair-portable.mjs
      - name: Actual optional NASA imagery and controlled map recovery
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/acceptance/cloud-native-map-provider-acceptance.mjs --source=$env:GITHUB_SHA
      - name: Actual display range and natural manual refresh interval
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        timeout-minutes: 8
        run: node scripts/acceptance/cloud-native-nearby-controls-acceptance.mjs --source=$env:GITHUB_SHA
      - name: Retain exact package and bounded owned-app evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-map-discovery-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/pc-cloud-upgrade/*.exe
            apps/pc-app/dist/build-manifest.json
            apps/pc-app/dist/runtime-closure.json
            artifacts/foundation/cloud-engineering/package-audit.json
            artifacts/foundation/cloud-engineering/focused-portable/*/evidence.json
            artifacts/foundation/cloud-engineering/focused-portable/*/signed-out-evidence.json
            artifacts/qa/native-map-provider/run-*/evidence.json
            artifacts/qa/native-map-provider/run-*/nearby-loaded.png
            artifacts/qa/native-map-provider/run-*/nearby-recovered.png
            artifacts/qa/native-map-provider/run-*/territory-map.png
            artifacts/qa/native-map-provider/run-*/failure.png
            artifacts/foundation/cloud-engineering/discoveryControlsDom/evidence.json
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/evidence.json
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-cooldown.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-retryable-error.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-retry-success.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-approved-range-and-throttle-failed.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-failed-manual-locate-immediate-retry-failed.png
