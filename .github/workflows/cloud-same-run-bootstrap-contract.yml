name: DesktopPet fixed bootstrap preauthorization contract
on:
  push:
    branches: [codex/cloud-authority-convergence]
    paths:
      - .github/workflows/cloud-same-run-bootstrap-contract.yml
      - scripts/acceptance/recovery/same-run-bootstrap.mjs
      - scripts/acceptance/recovery/same-run-bootstrap.test.mjs
      - scripts/acceptance/recovery/same-run-bootstrap-windows.test.mjs
      - scripts/acceptance/recovery/run-same-run.mjs
      - scripts/acceptance/recovery/same-run-process.ps1
      - scripts/acceptance/recovery/same-run-authorization-wait-selftest.mjs
      - scripts/acceptance/recovery/same-run-lifetime-timer.mjs
      - scripts/acceptance/recovery/same-run-lifetime-contract.ps1
permissions:
  contents: read
concurrency:
  group: desktoppet-fixed-bootstrap-contract
  cancel-in-progress: false
jobs:
  startup:
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        host: [ps5, ps7]
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Preserve reviewed LF bytes and fixed temporary job clock
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          git config --global core.autocrlf false
          if($env:RUNNER_TEMP -match '[\r\n]'){throw 'INVALID_RUNNER_TEMP'}
          'TEMP='+$env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'TMP='+$env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $p=Join-Path $env:RUNNER_TEMP ('same-run-job-clock-'+$env:GITHUB_RUN_ID+'.json')
          if(Test-Path -LiteralPath $p){throw 'NO_JOB_DEADLINE_RESTART'}
          $now=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          @{version=1;run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;startedAtMs=$now;hardEndMs=($now+19200000)}|ConvertTo-Json|Set-Content -LiteralPath $p -Encoding utf8
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix scripts/acceptance/recovery --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Original exact owned-process identity selftest
        shell: pwsh
        run: |
          if('${{ matrix.host }}' -ceq 'ps5') {
            & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/same-run-process.ps1 -Action selftest
          } elseif('${{ matrix.host }}' -ceq 'ps7') {
            ./scripts/acceptance/recovery/same-run-process.ps1 -Action selftest
          } else { throw 'UNKNOWN_FIXED_DIAGNOSTIC_HOST' }
      - name: Shared real Start and real authorization wait first-tick handshake
        id: start
        shell: pwsh
        run: |
          if('${{ matrix.host }}' -ceq 'ps5') {
            & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/same-run-process.ps1 -Action handshake-start
          } elseif('${{ matrix.host }}' -ceq 'ps7') {
            ./scripts/acceptance/recovery/same-run-process.ps1 -Action handshake-start
          } else { throw 'UNKNOWN_FIXED_DIAGNOSTIC_HOST' }
      - name: Actual authorization phase command before request upload
        if: steps.start.outcome == 'success'
        shell: pwsh
        run: |
          if('${{ matrix.host }}' -ceq 'ps5') {
            & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/same-run-process.ps1 -Action authorization
          } elseif('${{ matrix.host }}' -ceq 'ps7') {
            ./scripts/acceptance/recovery/same-run-process.ps1 -Action authorization
          } else { throw 'UNKNOWN_FIXED_DIAGNOSTIC_HOST' }
      - uses: actions/upload-artifact@v7.0.2
        if: steps.start.outcome == 'success'
        with:
          name: same-run-bootstrap-${{ matrix.host }}-${{ github.run_id }}-authorization-request
          retention-days: 7
          if-no-files-found: error
          path: artifacts/qa/same-run-entry-${{ github.run_id }}/authorization-request.json
      - name: Confirm same exact process survives next step then request test cancellation only
        shell: pwsh
        run: |
          if('${{ matrix.host }}' -ceq 'ps5') {
            & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/same-run-process.ps1 -Action handshake-ack
          } elseif('${{ matrix.host }}' -ceq 'ps7') {
            ./scripts/acceptance/recovery/same-run-process.ps1 -Action handshake-ack
          } else { throw 'UNKNOWN_FIXED_DIAGNOSTIC_HOST' }
      - name: Confirm cancellation without authorization and exact own-process exit
        if: always()
        shell: pwsh
        run: |
          if('${{ matrix.host }}' -ceq 'ps5') {
            & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/same-run-process.ps1 -Action handshake-final
          } elseif('${{ matrix.host }}' -ceq 'ps7') {
            ./scripts/acceptance/recovery/same-run-process.ps1 -Action handshake-final
          } else { throw 'UNKNOWN_FIXED_DIAGNOSTIC_HOST' }
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: same-run-bootstrap-contract-${{ matrix.host }}-${{ github.sha }}
          path: |
            artifacts/qa/same-run-entry-${{ github.run_id }}/handshake-host.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/handshake-evidence.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/authorization-request.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/authorization-wait-heartbeat.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/start-ready.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/handshake-terminal.json
          if-no-files-found: warn
          retention-days: 14
