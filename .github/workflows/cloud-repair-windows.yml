name: DesktopPet focused Windows repair acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/cloud-authority-convergence']
    paths:
      - '.github/workflows/cloud-repair-windows.yml'
      - 'apps/pc-app/runtime/**'
      - 'apps/pc-app/ui/src/**'
      - 'packages/shared-types/**'
      - 'tests/regressions/cloud-repair/**'
      - 'scripts/acceptance/cloud-repair-portable.mjs'
      - 'scripts/acceptance/portable-signed-out-inspect.mjs'
      - 'scripts/acceptance/cloud-loggedout-window-smoke.mjs'
      - 'scripts/acceptance/cloud-startup-registration-smoke.mjs'
      - 'scripts/acceptance/full-acceptance-*.mjs'
      - 'tests/foundation/**'
      - 'scripts/acceptance/portable-config-smoke.mjs'
      - 'scripts/desktop/**'
      - 'scripts/release/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'

permissions:
  contents: read

concurrency:
  group: focused-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-windows:
    # Deliberately not a release, deployment, real-account test or the old 98-case batch.
    # Test-only continuation commits use the immutable-package workflow; its guard
    # rejects any product/dependency/build change before reusing prior results.
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence' && !contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[desktop-interaction-only]') && !contains(github.event.head_commit.message, '[desktop-tray-only]')
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Ordinary isolated dependency install
        run: npm ci
      - name: Shared Node and Electron SQLite N-API probe
        run: npm run native:check
      - name: Type-check touched desktop and UI contracts
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck:ui
      - name: Only repair and directly related CJS regressions in real Windows Electron
        shell: pwsh
        run: |
          $files = @(Get-ChildItem tests/regressions/cloud-repair/*.test.cjs | ForEach-Object { $_.FullName })
          $files += @('tests/foundation/resource-backup.test.cjs', 'apps/pc-app/runtime/features/conversations/tests/cloud-records.test.cjs', 'apps/pc-app/runtime/features/accounts/tests/supabase-main.test.cjs', 'apps/pc-app/runtime/features/accounts/tests/cloud-refresh.test.cjs', 'apps/pc-app/runtime/features/companions/tests/cloud-authority.test.cjs')
          New-Item -ItemType Directory -Force artifacts/qa/dot-repair-20261027 | Out-Null
          node scripts/desktop/run-native-tests.cjs @files | Tee-Object artifacts/qa/dot-repair-20261027/windows-native-regressions.tap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/regressions/cloud-repair/garden-pending-recovery.test.mjs | Tee-Object artifacts/qa/dot-repair-20261027/windows-garden-recovery.tap
      - name: Full isolated CJS and unit engineering layer (not original 98 native acceptance)
        run: |
          npm run test:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:unit
      - name: Selected-pet feed and per-pet interaction guard regressions
        run: node scripts/desktop/run-native-tests.cjs --test-name-pattern="recipe consumes|failed companion update|invalid quantities|touch cooldown" apps/pc-app/runtime/features/garden/garden.test.cjs apps/pc-app/runtime/features/companions/tests/service.test.cjs
      - name: Real Windows Chromium draft preservation and CAS regression
        run: node tests/regressions/cloud-repair/run-conversation-settings.mjs
      - name: Existing QA-027 resource draft regression in real Windows Chromium
        run: npm run test:resources-hook
      - name: Install optional DOM-only test dependency outside product checkout
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/desktoppet-dom" --ignore-scripts --no-audit --no-fund jsdom@30.1.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JSDOM_MODULE_PATH=$env:RUNNER_TEMP/desktoppet-dom/node_modules/jsdom" >> $env:GITHUB_ENV
          "JSDOM_MODULE=$env:RUNNER_TEMP/desktoppet-dom/node_modules/jsdom" >> $env:GITHUB_ENV
      - name: Actual account restore UI and About components with synthetic IPC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/qa/dot-repair-20261027 | Out-Null
          node tests/regressions/cloud-repair/run-account-restore-ui.mjs | Tee-Object artifacts/qa/dot-repair-20261027/account-ui-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/regressions/cloud-repair/run-about-dom.cjs | Tee-Object artifacts/qa/dot-repair-20261027/about-ui-windows.json
      - name: QA-021 conflict guidance and preserved-record action boundaries
        run: node tests/regressions/cloud-repair/run-qa021-guidance.mjs | Tee-Object artifacts/qa/dot-repair-20261027/qa021-windows.json
      - name: Actual App public About whitelist and protected route gate
        run: node tests/regressions/cloud-repair/run-app-public-about.mjs | Tee-Object artifacts/qa/dot-repair-20261027/app-about-windows.json
      - name: C06 actual component route return and session isolation
        run: node tests/regressions/cloud-repair/run-overview-selection.cjs | Tee-Object artifacts/qa/dot-repair-20261027/overview-selection-windows.json
      - name: Build actual portable Windows executable from clean committed source
        id: buildportable
        run: npm run package:pc:win
      - name: Verify ASAR closure, exact source/native bytes and public-only config
        id: auditportable
        run: npm run release:audit
      - name: Fresh-profile ordinary portable launch without login or QA grants
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/cloud-repair-portable.mjs
      - name: Keep completed signed-out native proof immediately
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-signedout-${{ github.sha }}
          retention-days: 14
          path: |
            artifacts/foundation/cloud-engineering/focused-portable/*/evidence.json
            artifacts/foundation/cloud-engineering/focused-portable/*/signed-out-evidence.json
            artifacts/foundation/cloud-engineering/focused-portable/*/signed-out-*.png
      - name: Offline production Electron desktop windows and IPC with disposable local QA data
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: npm run pc:smoke:engineering
      - name: Explicit simulated deferred tray service in real native windows
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/tray-recall-native.mjs
      - name: Signed-out actual SFX profile isolation and window lifecycle
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/cloud-loggedout-window-smoke.mjs
      - name: Disposable runner app-only startup registration and removal
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/cloud-startup-registration-smoke.mjs
      - name: Offline actual resource UI and canvas evidence
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/full-acceptance-resources.mjs
      - name: Offline disposable account UI lifecycle
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/full-acceptance-local-account.mjs
      - name: Offline native navigation, settings and preserved detail context
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/full-acceptance-navigation.mjs
      - name: Offline native desktop instances and owned-window OS drag input
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/full-acceptance-desktop.mjs
      - name: Offline isolated battle rendering and public player controls
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/battle-independent.mjs . artifacts/foundation/cloud-engineering/full-battle/run-current
      - name: Explicit simulated discovery and territory shared-battle paths
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.auditportable.outcome == 'success' }}
        run: node scripts/acceptance/context-independent.mjs . artifacts/foundation/cloud-engineering/full-context/run-current
      - name: Retain controlled proof only, never profiles, databases or credentials
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-focused-windows-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/pc-cloud-upgrade/*.exe
            apps/pc-app/dist/build-manifest.json
            apps/pc-app/dist/runtime-closure.json
            artifacts/foundation/cloud-engineering/native/latest.json
            artifacts/foundation/cloud-engineering/package-audit.json
            artifacts/foundation/cloud-engineering/focused-portable/*/evidence.json
            artifacts/foundation/cloud-engineering/focused-portable/*/about.png
            artifacts/foundation/cloud-engineering/focused-portable/*/ordinary-config/evidence.json
            artifacts/qa/dot-repair-20261027/dom-runs/*/report.json
            artifacts/qa/resource-hook-regressions/*/report.json
            artifacts/qa/dot-repair-20261027/account-ui-windows.json
            artifacts/qa/dot-repair-20261027/about-ui-windows.json
            artifacts/qa/dot-repair-20261027/qa021-windows.json
            artifacts/qa/dot-repair-20261027/app-about-windows.json
            artifacts/qa/dot-repair-20261027/overview-selection-windows.json
            artifacts/foundation/cloud-engineering/navigation/run-*/evidence.json
            artifacts/foundation/cloud-engineering/navigation/run-*/*.png
            artifacts/foundation/cloud-engineering/desktop-subset/run-*/evidence.json
            artifacts/foundation/cloud-engineering/desktop-subset/run-*/*-failure.png
            artifacts/qa/dot-repair-20261027/windows-native-regressions.tap
            artifacts/qa/dot-repair-20261027/windows-garden-recovery.tap

            artifacts/foundation/cloud-engineering/focused-portable/*/signed-out-evidence.json
            artifacts/foundation/cloud-engineering/focused-portable/*/signed-out-*.png
            artifacts/foundation/cloud-engineering/electron/run-*/evidence.json
            artifacts/foundation/cloud-engineering/electron/run-*/*.png
            artifacts/foundation/cloud-engineering/tray-native/run-*/evidence.json
            artifacts/foundation/cloud-engineering/loggedout-windows/run-*/evidence.json
            artifacts/foundation/cloud-engineering/startup-registration/run-*/evidence.json
            artifacts/foundation/cloud-engineering/local-account/run-*/evidence.json
            artifacts/foundation/cloud-engineering/local-account/run-*/*.png
            artifacts/foundation/full-acceptance/resources/run-*/evidence.json
            artifacts/foundation/full-acceptance/resources/run-*/*.png
            artifacts/foundation/cloud-engineering/full-battle/run-current/evidence.json
            artifacts/foundation/cloud-engineering/full-battle/run-current/*.png
            artifacts/foundation/cloud-engineering/full-context/run-current/evidence.json
            artifacts/foundation/cloud-engineering/full-context/run-current/*.png
            artifacts/foundation/cloud-engineering/loggedout-windows/run-*/ordinary-config/evidence.json
            artifacts/foundation/cloud-engineering/loggedout-windows/run-*/independent-profile/ordinary-config/evidence.json

  isolated-cloud-source:
    # Test-only continuation commits use the immutable-package workflow; its guard
    # rejects any product/dependency/build change before reusing prior results.
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence' && !contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[desktop-interaction-only]') && !contains(github.event.head_commit.message, '[desktop-tray-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Local SQL and Deno contracts only, no deployed service or credentials
        run: npm run verify:cloud
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-cloud-source-${{ github.sha }}
          retention-days: 14
          path: |
            artifacts/foundation/cloud-engineering/cloud-source-check.json
            artifacts/foundation/cloud-engineering/cloud-source-check/run-*/*.log
