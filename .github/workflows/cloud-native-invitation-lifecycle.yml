name: DesktopPet audited-package invitation lifecycle acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/cloud-authority-convergence']
    paths:
      - '.github/workflows/cloud-native-invitation-lifecycle.yml'
      - 'scripts/acceptance/cloud-native-invitation-lifecycle-acceptance.mjs'
      - 'scripts/acceptance/qa-invitation-sql-bridge.mjs'
      - 'scripts/acceptance/qa-invitation-sql-bridge.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-invitation-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invitation-lifecycle:
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PACKAGE_SOURCE: 116ac7c63b716d5b913066d534998a801925d7ea
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Isolated normal test dependencies without product build
        run: npm ci
      - name: Verify real SQL bridge identity, parameterization and cancellation contracts
        id: sqlcontract
        timeout-minutes: 2
        run: node scripts/acceptance/qa-invitation-sql-bridge.test.mjs
      - name: Download this repository's exact audited package
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktoppet-desktop-tray-116ac7c63b716d5b913066d534998a801925d7ea
          run-id: 40511452484
          github-token: ${{ github.token }}
          path: artifacts/qa/native-baseline
      - name: Verify source tree, test-only difference, closure and exact SFX hash
        id: reuse
        run: node scripts/acceptance/verify-portable-reuse.mjs --source=$env:PACKAGE_SOURCE
      - name: Original SQL cancellation and natural five-minute invitation expiry through normal UI
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' && steps.sqlcontract.outcome == 'success' }}
        timeout-minutes: 12
        run: node scripts/acceptance/cloud-native-invitation-lifecycle-acceptance.mjs --source=$env:PACKAGE_SOURCE
      - name: Retain only bounded new evidence and owned-app screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-native-invitation-lifecycle-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/qa/native-continuation/package-reuse.json
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/evidence.json
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/B08-before-cancel.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/B08-cancelled-a.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/B08-cancelled-b.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/B09-pending-before-deadline.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/B09-expired-a.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/B09-expired-b.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/failed-a.png
            artifacts/foundation/cloud-engineering/invitationLifecycle/run-*/failed-b.png
