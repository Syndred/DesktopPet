name: DesktopPet audited-package discovery affected-entry regression

on:
  workflow_dispatch:
  push:
    branches: ['codex/cloud-authority-convergence']
    paths:
      - '.github/workflows/cloud-native-discovery-entry.yml'
      - 'scripts/acceptance/cloud-native-discovery-entry-regression.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-discovery-entry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-entry:
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence'
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PACKAGE_SOURCE: 1c9af85185bc0fd09a30b02c624c29e9f6cc0bbd
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Isolated normal test dependencies without product build
        run: npm ci
      - name: Download this repository's exact audited package
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktoppet-map-discovery-1c9af85185bc0fd09a30b02c624c29e9f6cc0bbd
          run-id: 40605728788
          github-token: ${{ github.token }}
          path: artifacts/qa/native-baseline
      - name: Verify source tree, test-only difference, closure and exact SFX hash
        id: reuse
        run: node scripts/acceptance/verify-portable-reuse.mjs --source=$env:PACKAGE_SOURCE
      - name: Changed privacy, encounter and resume entry regressions
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/acceptance/cloud-native-discovery-entry-regression.mjs --source=$env:PACKAGE_SOURCE
      - name: Retain only bounded new evidence and owned-app screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-native-discovery-entry-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/qa/native-continuation/package-reuse.json
            artifacts/foundation/cloud-engineering/discoveryEntry/run-*/evidence.json
            artifacts/foundation/cloud-engineering/discoveryEntry/run-*/M02-privacy-refusal.png
            artifacts/foundation/cloud-engineering/discoveryEntry/run-*/entry-preview.png
            artifacts/foundation/cloud-engineering/discoveryEntry/run-*/entry-session-resumed.png
            artifacts/foundation/cloud-engineering/discoveryEntry/run-*/M02-ordinary-privacy-refusal-failed.png
            artifacts/foundation/cloud-engineering/discoveryEntry/run-*/M05-M06-entry-session-regression-failed.png
