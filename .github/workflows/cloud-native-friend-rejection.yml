name: DesktopPet audited-package friend rejection acceptance

on:
  workflow_dispatch:
  push:
    branches: ['codex/cloud-authority-convergence']
    paths:
      - '.github/workflows/cloud-native-friend-rejection.yml'
      - 'scripts/acceptance/cloud-native-friend-rejection-acceptance.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-friend-rejection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  friend-rejection:
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence'
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PACKAGE_SOURCE: 116ac7c63b716d5b913066d534998a801925d7ea
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Isolated normal test dependencies without product build
        run: npm ci
      - name: Download this repository's exact audited package
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktoppet-desktop-tray-116ac7c63b716d5b913066d534998a801925d7ea
          run-id: 40511452484
          github-token: ${{ github.token }}
          path: artifacts/qa/native-baseline
      - name: Verify source tree, test-only difference, closure and exact SFX hash
        id: reuse
        run: node scripts/acceptance/verify-portable-reuse.mjs --source=$env:PACKAGE_SOURCE
      - name: Normal local invitation rejection and a later distinct invitation
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/acceptance/cloud-native-friend-rejection-acceptance.mjs --source=$env:PACKAGE_SOURCE
      - name: Retain only bounded new evidence and owned-app screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-native-friend-rejection-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/qa/native-continuation/package-reuse.json
            artifacts/foundation/cloud-engineering/friendReject/run-*/evidence.json
            artifacts/foundation/cloud-engineering/friendReject/run-*/B07-sender-after-reject.png
            artifacts/foundation/cloud-engineering/friendReject/run-*/B07-recipient-after-reject.png
            artifacts/foundation/cloud-engineering/friendReject/run-*/B07-new-invitation.png
            artifacts/foundation/cloud-engineering/friendReject/run-*/B07-failed-owned-app.png
