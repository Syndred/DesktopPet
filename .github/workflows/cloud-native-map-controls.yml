name: DesktopPet audited-package map and controls continuation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-map-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  map-controls:
    if: github.ref == 'refs/heads/codex/cloud-authority-convergence'
    strategy:
      fail-fast: false
      matrix:
        flow: [map-provider]
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PACKAGE_SOURCE: 1c9af85185bc0fd09a30b02c624c29e9f6cc0bbd
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Isolated normal test dependencies without product build
        run: npm ci
      - name: Download this repository's exact audited package
        uses: actions/download-artifact@v8.0.2
        with:
          name: desktoppet-map-discovery-1c9af85185bc0fd09a30b02c624c29e9f6cc0bbd
          run-id: 40605728788
          github-token: ${{ github.token }}
          path: artifacts/qa/native-baseline
      - name: Verify source tree, test-only difference, closure and exact SFX hash
        id: reuse
        run: node scripts/acceptance/verify-portable-reuse.mjs --source=$env:PACKAGE_SOURCE
      - name: Actual narrow map or nearby-controls continuation
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        timeout-minutes: 10
        run: node scripts/acceptance/cloud-native-${{ matrix.flow }}-acceptance.mjs --source=$env:PACKAGE_SOURCE
      - name: Retain only bounded new evidence and owned-app screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktoppet-native-map-controls-${{ matrix.flow }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/qa/native-continuation/package-reuse.json
            artifacts/qa/native-map-provider/run-*/evidence.json
            artifacts/qa/native-map-provider/run-*/nearby-loaded.png
            artifacts/qa/native-map-provider/run-*/nearby-recovered.png
            artifacts/qa/native-map-provider/run-*/territory-map.png
            artifacts/qa/native-map-provider/run-*/failure.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/evidence.json
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-cooldown.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-retryable-error.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-retry-success.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-approved-range-and-throttle-failed.png
            artifacts/foundation/cloud-engineering/nearbyControls/run-*/M04-failed-manual-locate-immediate-retry-failed.png
