name: DesktopPet protected environment completion
# Preparation only until platform numeric pins and environment configuration are independently approved.
on:
  push:
    branches: [codex/cloud-authority-convergence]
    paths: [scripts/acceptance/requests/same-run-next-trigger.json, .github/workflows/cloud-environment-completion.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: desktoppet-environment-completion
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/codex/cloud-authority-convergence' &&
      (github.event_name == 'push' &&
      github.actor == 'Syndred' && github.triggering_actor == 'Syndred' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'acceptance: authorized same-run completion '))
    environment: desktoppet-qa-20261028
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      DESKTOPPET_QA_CUSTODY_BINDING_JSON: ${{ vars.DESKTOPPET_QA_CUSTODY_BINDING_JSON }}
      PACKAGE_SOURCE: 5016f1c3f7de04b4e2b322d0b47ec52248596771
    steps:
      - name: Preserve original job deadline with ten-minute terminal cleanup reserve
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          if($env:RUNNER_TEMP -match '[\r\n]'){throw 'INVALID_RUNNER_TEMP'}
          'TEMP='+$env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'TMP='+$env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $p=Join-Path $env:RUNNER_TEMP ('same-run-job-clock-'+$env:GITHUB_RUN_ID+'.json')
          if(Test-Path -LiteralPath $p){throw 'NO_JOB_DEADLINE_RESTART'}
          $now=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          @{version=1;run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;startedAtMs=$now;hardEndMs=($now+19200000)}|ConvertTo-Json|Set-Content -LiteralPath $p -Encoding utf8
      - name: Preserve reviewed source bytes before checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Exact one-new-file protected-platform trigger guard
        id: request
        if: github.event_name == 'push'
        run: node scripts/acceptance/recovery/same-run-request.mjs --check
      - run: npm ci
      - run: npm ci --prefix scripts/acceptance/recovery --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Entry argument and opaque capability negative contracts
        run: node --test scripts/acceptance/recovery/github-environment-admission.test.mjs scripts/acceptance/recovery/holder-environment.test.mjs scripts/acceptance/recovery/environment-entry.test.mjs scripts/acceptance/dpapi/platform-vault-source.test.mjs scripts/acceptance/cloud-live-qa-s06-platform-transition.test.mjs scripts/acceptance/cloud-live-qa-s02-platform-cell.test.mjs scripts/acceptance/recovery/same-run-request.test.mjs scripts/acceptance/recovery/same-run-fixture-index.test.mjs
      - name: Thirteen real Windows synthetic custody checks before any real identity
        timeout-minutes: 5
        run: node scripts/acceptance/dpapi/authorized-vault-windows.test.mjs
      - name: Isolated real platform-source Windows custody contract (no accounts)
        timeout-minutes: 5
        run: node scripts/acceptance/recovery/environment-adapter-windows.test.mjs
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: '12786865736'
          run-id: 40618386720
          github-token: ${{ github.token }}
          path: artifacts/qa/native-baseline
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: '12783353029'
          run-id: 40607080843
          github-token: ${{ github.token }}
          path: artifacts/qa/same-run-prior
          merge-multiple: true
      - name: Strict audited actual 5016 package reuse
        run: node scripts/acceptance/verify-portable-reuse.mjs --source=$env:PACKAGE_SOURCE
      - name: Exact holder identity negative selftest
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action selftest
      - name: Fixed environment entry (secrets are not job environment)
        id: start
        if: steps.request.outcome == 'success'
        shell: pwsh
        env:
          GH_ENVIRONMENT_ADMISSION_TOKEN: ${{ github.token }}
          DESKTOPPET_QA_A_PASSWORD: ${{ secrets.DESKTOPPET_QA_A_PASSWORD }}
          DESKTOPPET_QA_B_PASSWORD: ${{ secrets.DESKTOPPET_QA_B_PASSWORD }}
          DESKTOPPET_QA_CAS_PROVENANCE: ${{ secrets.DESKTOPPET_QA_CAS_PROVENANCE }}
          DESKTOPPET_QA_BUSINESS_DEADLINE_MS: ${{ vars.DESKTOPPET_QA_BUSINESS_DEADLINE_MS }}
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action start
      - name: Fixed identity phase
        if: steps.start.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action identity
      - uses: actions/upload-artifact@v7.0.2
        if: steps.start.outcome == 'success'
        with:
          name: environment-${{ github.run_id }}-identity
          retention-days: 1
          if-no-files-found: error
          path: artifacts/qa/same-run-${{ github.run_id }}/identity-manifest.json
      - name: Fixed baseline phase
        if: steps.start.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action baseline
      - uses: actions/upload-artifact@v7.0.2
        if: steps.start.outcome == 'success'
        with:
          name: environment-${{ github.run_id }}-baseline
          retention-days: 1
          if-no-files-found: error
          path: artifacts/qa/same-run-${{ github.run_id }}/awaiting-platform-grant-transition.json
      - name: Fixed warning phase
        if: steps.start.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action warning
      - uses: actions/upload-artifact@v7.0.2
        if: steps.start.outcome == 'success'
        with:
          name: environment-${{ github.run_id }}-warning
          retention-days: 1
          if-no-files-found: error
          path: artifacts/qa/same-run-${{ github.run_id }}/s06-platform-warning.json
      - name: Fixed completion join
        if: steps.start.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action final
      - name: Bounded same-job original-intent readback only after failure
        if: failure() && (steps.start.outcome == 'success' || steps.start.outcome == 'failure')
        shell: pwsh
        env:
          GH_ENVIRONMENT_ADMISSION_TOKEN: ${{ github.token }}
          DESKTOPPET_QA_BUSINESS_DEADLINE_MS: ${{ vars.DESKTOPPET_QA_BUSINESS_DEADLINE_MS }}
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action reconcile
      - name: Exact owned watchdog terminal cleanup
        if: always() && (steps.start.outcome == 'success' || steps.start.outcome == 'failure')
        shell: pwsh
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/acceptance/recovery/environment-process.ps1 -Action stop
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: environment-${{ github.run_id }}-fixed-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/qa/authorized-dpapi-synthetic/evidence.json
            artifacts/qa/native-continuation/package-reuse.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/terminal-cleanup.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/identity-selftest/supervisor-selftest.json
            artifacts/qa/same-run-${{ github.run_id }}/lifecycle-cleanup.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/completion-driver-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s06-metadata/live-s06-metadata-completion-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/resource-restore/live-restore-completion-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/live-identity-ui-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s05/live-record-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/p05/live-record-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/garden-sync/live-garden-sync-completion-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s04/live-cross-domain-conflict-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/friend-completion/live-friend-completion-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s02-territory-producer/live-s02-territory-producer-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s02-base-producer/live-s02-base-producer-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s02/live-cross-domain-conflict-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-wild/live-discovery-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-ui/live-discovery-ui-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/new-c-lifecycle/new-c-ui-lifecycle-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s06-metadata/s06-owned-a3-garden/live-garden-sync-completion-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s06-metadata/s06-owned-a3-garden/live-garden-sync-completion-intent.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/resource-restore/live-restore-completion-intent.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/C03-list.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/C03-detail.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/C03-chat.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/C03-battle.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/C03-desktop.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/identity-ui/C03-relaunch.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s05/live-record-intents.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/p05/live-record-intents.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/garden-sync/live-garden-sync-completion-intent.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s04/live-cross-domain-conflict-intent.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/friend-completion/live-friend-completion-intents.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/friend-completion/live-authority-realtime-observation.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/friend-completion/live-authority-readback-evidence.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s02/live-cross-domain-conflict-intent.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-wild/live-discovery-intents.json
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-ui/M07-initial-ready.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-ui/M07-source-error.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-ui/M07-source-recovered.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-ui/M07-nearby-error.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/discovery-ui/M07-nearby-recovered.png
            artifacts/qa/same-run-${{ github.run_id }}/completion/fixed-completion/s02-territory-producer/live-s02-territory-producer-intents.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/environment-status.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/environment-start-ready.json
            artifacts/qa/same-run-${{ github.run_id }}/environment-custody.json
            artifacts/qa/same-run-${{ github.run_id }}/precredential-model-readiness.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/environment-bootstrap.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/environment-bootstrap-reconciliation.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/environment-reconciliation-status.json
            artifacts/qa/same-run-entry-${{ github.run_id }}/environment-reconciliation-result.json
            artifacts/qa/environment-adapter-contract/evidence.json
