name: Release Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Target release version to rollback to"
        required: true
        type: string
      source_run_id:
        description: "Successful release workflow run containing the verified target binary"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rollback:
    runs-on: windows-latest
    env:
      ROLLBACK_TARGET: ${{ inputs.target_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Validate target directory before downloading
        run: node --input-type=module -e "import {releaseVersion} from './scripts/release/release-store.mjs'; releaseVersion(process.env.ROLLBACK_TARGET)"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-${{ inputs.target_version }}
          path: releases/${{ inputs.target_version }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and select the downloaded binary, then resolve the exact launch path
        run: |
          node scripts/release/rollback-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release/launch-release.mjs --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rollback-state-${{ inputs.target_version }}
          path: |
            release-state/current.json
            release-state/last-rollback.json
            releases/${{ inputs.target_version }}/manifest.json

